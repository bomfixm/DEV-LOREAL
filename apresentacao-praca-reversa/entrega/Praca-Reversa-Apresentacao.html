:root {
  --amarelo: #FFCC00;
  --amarelo-escuro: #E3B400;
  --vermelho: #D40511;
  --grafite: #17191C;
  --grafite-2: #1F2226;
  --grafite-3: #2A2E34;
  --grafite-4: #3A3F47;
  --off: #F5F3EB;
  --off-2: #ECE8DC;
  --branco: #FFFFFF;
  --tx: #17191C;
  --tx-2: #474C54;
  --tx-3: #6B6F77;
  --linha: #DCD7C9;
  --tx-escuro: #F5F3EB;
  --tx-escuro-2: #C9C5B8;
  --tx-escuro-3: #9A978E;
  --ok: #17784A;
  --teste: #B87700;
  --ajuste: #C2410C;
  --curva: cubic-bezier(.16, .84, .24, 1);
  --curva-saida: cubic-bezier(.5, 0, .75, 0);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #0B0C0E;
  color: var(--tx);
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body.ocultar-cursor { cursor: none; }

#tela { position: fixed; inset: 0; overflow: hidden; }
#palco {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  overflow: hidden;
  background: var(--grafite);
}
#carregando {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--tx-escuro-3); font-size: 28px; letter-spacing: .04em; background: var(--grafite); z-index: 50;
}
#cortina { position: absolute; inset: 0; background: #000; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
body.cortina #cortina { opacity: 1; }

/* ---------- Cenas ---------- */
.cena { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.cena.ativa { visibility: visible; z-index: 2; animation: cenaEntra .42s ease both; }
.cena.saindo { visibility: visible; z-index: 1; pointer-events: none; animation: cenaSai .4s var(--curva-saida) both; }
.cena.saindo.sai-aproxima { animation: cenaSaiAproxima .55s var(--curva-saida) both; transform-origin: 72% 46%; }
@keyframes cenaEntra { from { opacity: 0; } }
@keyframes cenaSai { to { opacity: 0; transform: scale(1.012); } }
@keyframes cenaSaiAproxima { to { opacity: 0; transform: scale(1.14); } }

.fundo-claro { background: var(--off); color: var(--tx); }
.fundo-escuro { background: var(--grafite); color: var(--tx-escuro); }
.fundo-claro::before, .fundo-escuro::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
}
.fundo-claro::before { background: radial-gradient(120% 90% at 85% 0%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 60%); }
.fundo-escuro::before { background: radial-gradient(90% 70% at 50% 120%, rgba(255, 204, 0, .10), rgba(255, 204, 0, 0) 70%); }

/* Luz ambiente: lenta, de ida e volta (sem salto no fim do ciclo). Nunca move texto. */
.luz { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform; animation: deriva 14s ease-in-out infinite alternate; }
.luz.l-amarela { background: radial-gradient(closest-side, rgba(255, 204, 0, .26), rgba(255, 204, 0, 0)); }
.luz.l-amarela-suave { background: radial-gradient(closest-side, rgba(255, 204, 0, .14), rgba(255, 204, 0, 0)); }
.luz.l-quente { background: radial-gradient(closest-side, rgba(255, 170, 40, .22), rgba(255, 170, 40, 0)); }
.luz.l-branca { background: radial-gradient(closest-side, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); }
@keyframes deriva { to { transform: translate3d(var(--dx, 90px), var(--dy, -50px), 0) scale(1.08); } }
.camada-lenta { animation: derivaCamada 16s ease-in-out infinite alternate; will-change: transform; }
@keyframes derivaCamada { to { transform: translate3d(var(--dx, -18px), var(--dy, 10px), 0); } }

/* ---------- Entradas (o estilo-base é o estado de leitura; a animação só define o início) ---------- */
.cena.ativa [data-e] {
  animation-duration: .8s;
  animation-timing-function: var(--curva);
  animation-fill-mode: both;
  animation-delay: calc(.12s + var(--i, 0) * .09s);
}
.cena.ativa [data-e="sobe"] { animation-name: eSobe; }
.cena.ativa [data-e="escala"] { animation-name: eEscala; }
.cena.ativa [data-e="plano"] { animation-name: ePlano; animation-duration: 1s; }
.cena.ativa [data-e="esquerda"] { animation-name: eEsquerda; }
.cena.ativa [data-e="direita"] { animation-name: eDireita; }
.cena.ativa [data-e="fade"] { animation-name: eFade; }
.cena.ativa [data-e="traco"] { animation-name: eTraco; animation-duration: .9s; }
.cena.ativa [data-e="largura"] { animation-name: eLargura; transform-origin: 0 50%; }
.cena.ativa [data-e="altura"] { animation-name: eAltura; transform-origin: 50% 0; }
@keyframes eSobe { from { opacity: 0; transform: translateY(34px); } }
@keyframes eEscala { from { opacity: 0; transform: scale(.93); } }
@keyframes ePlano { from { opacity: 0; transform: perspective(1800px) rotateX(16deg) translateY(70px) scale(.96); } }
@keyframes eEsquerda { from { opacity: 0; transform: translateX(-44px); } }
@keyframes eDireita { from { opacity: 0; transform: translateX(44px); } }
@keyframes eFade { from { opacity: 0; } }
@keyframes eTraco { from { stroke-dashoffset: var(--comp, 1000); } }
@keyframes eLargura { from { transform: scaleX(0); } }
@keyframes eAltura { from { transform: scaleY(0); } }
[data-e="traco"] { stroke-dasharray: var(--comp, 1000); stroke-dashoffset: 0; }

/* Medição das pontes: a cena aparece no estado de leitura, sem animação, por um instante. */
.medindo, .medindo * { animation: none !important; transition: none !important; }
.ponte-alvo, .ponte-alvo * { animation: none !important; }
.ponte-oculto { opacity: 0 !important; }
#pontes { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#pontes > * { position: absolute; margin: 0 !important; transform-origin: 0 0; will-change: transform, opacity; }

/* Movimento reduzido: entradas viram um fade curto, luz parada, sem pontes. */
body.calmo .cena.ativa { animation-duration: .2s; }
body.calmo .cena.saindo { animation: cenaSai .2s linear both; }
body.calmo .cena.ativa [data-e] { animation-name: eFade !important; animation-duration: .25s !important; animation-delay: 0s !important; }
body.calmo .luz, body.calmo .camada-lenta, body.calmo .anima-continua { animation-play-state: paused !important; }
body.calmo .mapa-camera { animation: none !important; }

/* ---------- Tipografia e peças comuns ---------- */
.marca { position: absolute; left: 120px; top: 60px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.marca svg { width: 40px; height: 40px; border-radius: 9px; }
.fundo-escuro .marca { color: var(--tx-escuro); }
.titulo { margin: 0; font-size: 72px; font-weight: 800; letter-spacing: -.028em; line-height: 1.04; }
.titulo .destaque { color: var(--vermelho); }
.fundo-escuro .titulo .destaque { color: var(--amarelo); }
.apoio { margin: 0; font-size: 32px; line-height: 1.38; color: var(--tx-2); font-weight: 500; }
.fundo-escuro .apoio { color: var(--tx-escuro-2); }
.rotulo { font-size: 20px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--tx-3); }
.fundo-escuro .rotulo { color: var(--tx-escuro-3); }
.num { font-variant-numeric: tabular-nums; }

.selos { display: flex; flex-wrap: wrap; gap: 14px; }
.selo {
  display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; border-radius: 999px;
  font-size: 22px; font-weight: 600; background: rgba(23, 25, 28, .065); color: var(--tx); white-space: nowrap;
}
.selo i { width: 13px; height: 13px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px rgba(23, 120, 74, .16); }
.selo.teste i { background: var(--teste); box-shadow: 0 0 0 4px rgba(184, 119, 0, .18); }
.selo.ajuste i { background: var(--ajuste); box-shadow: 0 0 0 4px rgba(194, 65, 12, .18); }
.selo .estado { font-weight: 700; }
.selo .sep { opacity: .45; }
.fundo-escuro .selo, .cartao-escuro .selo { background: rgba(255, 255, 255, .08); color: var(--tx-escuro); }
.cartao-escuro .rotulo { color: var(--tx-escuro-3); }
.fundo-escuro .placa { background: #0E0F11; border-color: rgba(255, 204, 0, .45); }

.exemplo { display: inline-flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; color: var(--tx-2); }
.exemplo svg { width: 22px; height: 26px; flex: none; }
.fundo-escuro .exemplo { color: var(--tx-escuro-2); }
.nota-tela { font-size: 22px; color: var(--tx-3); font-weight: 500; }
.fundo-escuro .nota-tela { color: var(--tx-escuro-3); }

/* Cartões e placas */
.cartao { background: var(--branco); border-radius: 28px; box-shadow: 0 1px 0 rgba(23, 25, 28, .04), 0 22px 60px -24px rgba(23, 25, 28, .28), 0 0 0 1px rgba(23, 25, 28, .05); }
.cartao-escuro { background: var(--grafite-2); border-radius: 28px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .07), 0 30px 80px -30px rgba(0, 0, 0, .7); color: var(--tx-escuro); }
.placa {
  display: inline-flex; flex-direction: column; gap: 2px; padding: 12px 22px 14px; border-radius: 12px;
  background: var(--grafite); color: var(--amarelo); border: 2px solid var(--grafite);
}
.placa small { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--tx-escuro-3); font-weight: 700; }
.placa b { font-size: 34px; font-weight: 800; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.palete-titulo { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; letter-spacing: -.02em; color: var(--tx); }
.palete-titulo svg { width: 54px; height: 40px; flex: none; }
.palete-chip {
  display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 14px;
  background: var(--branco); color: var(--tx); font-size: 26px; font-weight: 800; white-space: nowrap;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45), 0 0 0 1px rgba(23, 25, 28, .08);
}
.palete-chip svg { width: 32px; height: 24px; }
.palete-chip.suave { background: var(--grafite-3); color: var(--tx-escuro); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14); }
.doc-chip {
  display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 14px;
  background: var(--branco); color: var(--tx); font-size: 26px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .35), 0 0 0 1px rgba(23, 25, 28, .08);
}
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo .k { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--tx-3); }
.campo .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--tx); }
.campo .v.vazio { color: var(--tx-3); font-weight: 600; font-style: italic; }

/* ---------- Mapa ---------- */
.mapa-svg { display: block; overflow: hidden; }
.mapa-svg text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }

/* ---------- Controles (fora do palco; somem sozinhos) ---------- */
#controles {
  position: fixed; right: 18px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 6px;
  padding: 6px; border-radius: 14px; background: rgba(20, 21, 24, .78); color: #EDEAE0;
  font: 600 14px/1 'Inter', 'Segoe UI', Arial, sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
  transition: opacity .35s ease, transform .35s ease; backdrop-filter: blur(6px);
}
body.controles-ocultos #controles { opacity: 0; transform: translateY(8px); pointer-events: none; }
#controles button {
  all: unset; cursor: pointer; padding: 9px 12px; border-radius: 9px; color: inherit; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
#controles button:hover { background: rgba(255, 255, 255, .12); }
#controles button[aria-pressed="true"] { background: rgba(255, 204, 0, .2); color: var(--amarelo); }
#controles .contador { padding: 0 8px; font-variant-numeric: tabular-nums; color: #BDB9AE; min-width: 64px; text-align: center; }
#controles .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, .14); margin: 0 2px; }
#progresso { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--amarelo); z-index: 59; transition: width .4s var(--curva), opacity .35s ease; }
body.controles-ocultos #progresso { opacity: 0; }

#aviso {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 70; max-width: 760px; padding: 14px 20px; border-radius: 12px;
  background: #1F2226; color: #F5F3EB; font: 500 16px/1.4 'Inter', 'Segoe UI', Arial, sans-serif; box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
#aviso.visivel { opacity: 1; }

/* Índice */
#indice {
  position: fixed; inset: 0; z-index: 65; background: rgba(11, 12, 14, .86); backdrop-filter: blur(8px); display: grid; place-items: center;
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
}
#indice[hidden] { display: none; }
#indice .caixa { width: min(1180px, 92vw); color: #F5F3EB; }
#indice h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; }
#indice h2 span { font-size: 15px; font-weight: 500; color: #9A978E; }
#indice ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
#indice button {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; gap: 14px; align-items: baseline; padding: 16px 18px; border-radius: 14px;
  background: rgba(255, 255, 255, .06); color: #F5F3EB; font-size: 18px; font-weight: 600; line-height: 1.3;
}
#indice button:hover, #indice button:focus-visible { background: rgba(255, 255, 255, .13); outline: none; }
#indice button[aria-current="true"] { background: rgba(255, 204, 0, .2); box-shadow: inset 0 0 0 2px var(--amarelo); }
#indice button b { color: var(--amarelo); font-variant-numeric: tabular-nums; }
#indice .atalhos { margin-top: 20px; font-size: 15px; color: #B5B1A6; line-height: 1.7; }
#indice kbd { font: 600 13px/1 'Inter', sans-serif; padding: 3px 7px; border-radius: 6px; background: rgba(255, 255, 255, .12); color: #F5F3EB; }

/* ---------- Modo estático (backup em PDF) ---------- */
body.estatico { overflow: visible; background: #fff; }
body.estatico #tela { position: static; overflow: visible; }
body.estatico #palco { position: static; transform: none !important; overflow: visible; height: auto; background: none; }
body.estatico .cena { position: relative; visibility: visible; width: 1920px; height: 1080px; break-after: page; }
body.estatico .cena:last-child { break-after: auto; }
body.estatico *, body.estatico *::before { animation: none !important; transition: none !important; }
body.estatico #controles, body.estatico #progresso, body.estatico #indice, body.estatico #carregando { display: none !important; }
@page { size: 1920px 1080px; margin: 0; }

/* 02 — informação */
.c2-cartao { position: absolute; top: 400px; width: 500px; height: 300px; padding: 38px 40px; }
.c2-cartao .ordem { font-size: 20px; font-weight: 800; color: var(--amarelo-escuro); letter-spacing: .08em; }
.c2-cartao h3 { margin: 14px 0 10px; font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
.c2-cartao p { margin: 0; font-size: 27px; line-height: 1.35; color: var(--tx-2); }
.c2-cartao .fichas { position: absolute; left: 40px; bottom: 36px; display: flex; gap: 10px; }
.ficha { display: inline-block; padding: 8px 14px; border-radius: 10px; background: var(--off); border: 1px solid var(--linha); font-size: 20px; font-weight: 700; color: var(--tx-2); }
.c2-verbos { position: absolute; left: 120px; top: 800px; display: flex; gap: 56px; font-size: 40px; font-weight: 800; letter-spacing: -.01em; }
.c2-verbos span { padding-bottom: 10px; border-bottom: 6px solid var(--amarelo); }

/* 03 — uma nota, paletes diferentes */
.c3-doc { position: absolute; left: 120px; top: 290px; width: 1680px; height: 150px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: var(--branco); border-radius: 24px; box-shadow: 0 0 0 1px rgba(23, 25, 28, .06), 0 22px 60px -26px rgba(23, 25, 28, .3); }
.c3-doc .num-doc { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
.c3-doc .rem { text-align: right; }
.c3-doc .rem b { display: block; margin-top: 6px; font-size: 28px; font-weight: 700; color: var(--tx); }
.c3-pal { position: absolute; top: 540px; width: 800px; height: 360px; padding: 40px 44px; }
.cena.ativa .c3-pal[data-e] { animation-name: eDoDocumento; animation-duration: .9s; }
@keyframes eDoDocumento { from { opacity: 0; transform: translateY(-200px) scale(.86, .5); } }
.c3-pal .topo { display: flex; justify-content: space-between; align-items: flex-start; }
.c3-pal .dados { position: absolute; left: 44px; right: 44px; bottom: 44px; display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 24px; padding-top: 30px; border-top: 1px solid var(--linha); }
.c3-rodape { position: absolute; left: 120px; right: 120px; top: 952px; display: flex; justify-content: space-between; align-items: center; }

/* 04 — a informação já existe */
.c4-fonte { position: absolute; left: 120px; width: 960px; padding: 32px 40px; }
.c4-fonte .cab { display: flex; justify-content: space-between; align-items: baseline; }
.c4-fonte .cab b { font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
.c4-linha { margin-top: 22px; display: grid; grid-template-columns: .8fr 1.2fr 1.5fr 1fr .8fr; border-radius: 14px; overflow: hidden; border: 1px solid var(--linha); }
.c4-linha div { padding: 12px 18px; }
.c4-linha .k { background: var(--off); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-3); border-bottom: 1px solid var(--linha); }
.c4-linha .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.c4-colunas { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.col-chip { padding: 9px 16px; border-radius: 10px; font-size: 23px; font-weight: 700; }
.col-chip.principal { background: var(--grafite); color: var(--off); }
.col-chip.adicional { background: var(--off); color: var(--tx-2); border: 1px solid var(--linha); }
.col-chip.manual { color: var(--tx-3); border: 2px dashed #C9C3B2; }
.c4-colunas .legenda { font-size: 20px; color: var(--tx-3); font-weight: 600; margin: 0 8px 0 6px; }
.c4-trilho { position: absolute; left: 1210px; top: 360px; width: 590px; height: 560px; }
.c4-passo { position: absolute; left: 0; display: flex; gap: 28px; align-items: flex-start; }
.c4-passo .bola { width: 64px; height: 64px; border-radius: 50%; background: var(--amarelo); color: var(--tx); display: grid; place-items: center; font-size: 28px; font-weight: 800; flex: none; box-shadow: 0 0 0 10px var(--off); }
.c4-passo h3 { margin: 4px 0 8px; font-size: 44px; font-weight: 800; letter-spacing: -.02em; }
.c4-passo p { margin: 0; font-size: 27px; line-height: 1.35; color: var(--tx-2); width: 460px; }

/* 05 — mapa */
.c5-esq { position: absolute; left: 120px; top: 150px; width: 680px; }
.c5-caminho { position: absolute; left: 120px; top: 420px; display: flex; flex-direction: column; gap: 0; align-items: flex-start; }
.c5-caminho .liga { width: 4px; height: 44px; margin-left: 38px; background: linear-gradient(var(--amarelo), rgba(255, 204, 0, .35)); border-radius: 2px; }
.c5-painel { position: absolute; left: 860px; top: 120px; width: 940px; height: 840px; overflow: hidden; }
.c5-painel .legenda-painel { position: absolute; left: 30px; top: 24px; font-size: 20px; font-weight: 600; color: var(--tx-escuro-3); z-index: 3; }
.mapa-camera { position: absolute; left: 0; top: 0; width: 940px; height: 840px; transform-origin: 0 0; }
.cena.ativa .mapa-camera { animation: zoomMapa 1.5s cubic-bezier(.65, 0, .25, 1) .25s both; }
@keyframes zoomMapa { from { transform: none; } 30% { transform: none; } }
.c5-marca { position: absolute; z-index: 4; }
.c5-marca > div { transform: translate(-100%, -50%); display: flex; align-items: center; gap: 0; }
.c5-marca .fio { width: 26px; height: 3px; background: var(--amarelo); }
.cena.ativa .c5-marca [data-e] { animation-delay: calc(1.55s + var(--i, 0) * .12s); }
.c5-mini { position: absolute; right: 22px; bottom: 22px; width: 232px; height: 182px; border-radius: 14px; background: rgba(23, 25, 28, .92); box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); padding: 8px; z-index: 5; }
.c5-mini .janela { position: absolute; border: 2px solid var(--amarelo); border-radius: 3px; box-shadow: 0 0 0 999px rgba(23, 25, 28, .25); }
.c5-mini small { position: absolute; left: 10px; bottom: 6px; font-size: 13px; color: var(--tx-escuro-3); font-weight: 600; }
.brilho-pos { animation: respira 10s ease-in-out infinite alternate; }
@keyframes respira { to { opacity: .28; } }

/* 06 — janela do palete */
.c6-trilha { position: absolute; left: 120px; top: 150px; width: 180px; height: 803px; opacity: .95; }
.c6-fio { position: absolute; left: 300px; height: 3px; background: linear-gradient(90deg, var(--amarelo), rgba(255, 204, 0, .25)); }
.c6-janela { position: absolute; left: 400px; top: 270px; width: 1400px; height: 600px; padding: 48px 56px; }
.c6-janela .topo { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 34px; border-bottom: 1px solid var(--linha); }
.c6-janela .grade { display: grid; grid-template-columns: 1.3fr .8fr .8fr; gap: 34px 40px; padding-top: 36px; }
.c6-janela .grade .largo { grid-column: span 2; }
.c6-janela .mais { position: absolute; left: 56px; right: 56px; bottom: 36px; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-radius: 14px; background: var(--off); font-size: 24px; font-weight: 600; color: var(--tx-2); }

        <p class="apoio" ${e('sobe', 1, 'margin-top:18px')}>Não inventar localização. Pendências internas ficam fora do mapa físico e da visão do cliente.</p>

      <div class="cartao c9-mapa" ${e('escala', 2)}><div class="abs" style="left:${(1040 - w) / 2}px;top:11px">${svgMapa({ id: 'm9', tema: 'claro', w, h })}</div></div>
      <div class="cartao c9-gaveta" ${e('direita', 4)}>
        <div class="rotulo">Área interna</div>
        <h3>Validação interna</h3>
        <ul>
          <li>${ICONE_OK}Não é uma posição física</li>
          <li>${ICONE_OK}Não conta como espaço ocupado</li>
          <li>${ICONE_OK}Não aparece para o cliente</li>
          <li>${ICONE_OK}Origem e histórico preservados</li>
        </ul>
        <div class="resolve">Com o endereço confirmado, a nota vai para o palete certo, com histórico.</div>

  // 10 — Cada pessoa vê o que precisa.
  cenas.push({
    id: '10', fundo: 'fundo-claro',
    html: () => `
      <div class="luz l-branca" style="left:700px;top:-300px;width:1300px;height:900px;--dx:-70px;--dy:60px;animation-duration:16s"></div>
      ${marca()}
      <div class="abs" style="left:120px;top:150px;width:1600px">
        <h2 class="titulo" ${e('sobe', 0)}>Cada pessoa vê o que precisa.</h2>
        <p class="apoio" ${e('sobe', 1, 'margin-top:18px')}>A mesma base, com acesso pelo perfil — também nas consultas.</p>
      </div>
      <div class="cartao-escuro c10-lado" ${e('esquerda', 2, 'left:120px')}>
        <div class="rotulo">Operação DHL</div>
        <h3>Estoque, localização e pendências</h3>
        <ul><li><i></i>Conteúdo e volumes dos paletes</li><li><i></i>Localização no mapa</li><li><i></i>Pendências e validação interna</li></ul>
        <div class="pe">${selo('DISPONIVEL', 'Painel da operação')}</div>
      </div>
      <div class="c10-meio" ${e('largura', 3)}></div>
      <div class="cartao c10-lado" ${e('direita', 3, 'left:1000px')}>
        <div class="rotulo">Cliente</div>
        <h3>Informações autorizadas</h3>
        <ul><li><i></i>Material disponível para consulta</li><li><i></i>O que foi solicitado</li><li><i></i>Histórico autorizado</li></ul>
        <div class="pe">${selo('TESTE', 'Painel do cliente')}</div>
      </div>
      <div class="c10-nota nota-tela" ${e('fade', 5)}>A validação interna não aparece na visão do cliente. Sem janelas reais cadastradas, esta cena não mostra números.</div>`,
  });

  // 11 — Cada mudança precisa de rastro.
  cenas.push({
    id: '11', fundo: 'fundo-escuro',
    html: () => `
      <div class="luz l-quente" style="left:-400px;top:-300px;width:1500px;height:1100px;--dx:120px;--dy:60px;animation-duration:15s"></div>
      ${marca()}
      <h2 class="titulo abs" ${e('sobe', 0, 'left:120px;top:150px')}>Cada mudança precisa de <span class="destaque">rastro.</span></h2>
      <div class="c11-cab rotulo" ${e('fade', 1)}><span>Origem</span><span>Responsável</span><span>Data</span><span>Registro</span></div>
      <div class="c11-tempo" ${e('altura', 2)}></div>
      <div class="c11-no real" ${e('escala', 3)}></div>
      <div class="cartao-escuro c11-linha real" ${e('esquerda', 3)}>
        <div>Inventário (planilha) · linha ${r256.linha}</div><div class="vazio">Não registrado</div><div class="num">${esc(r256.conferencia)}</div><div>Conferência informada · Palete ${esc(r256.palete)} · ${r256.volumes} volumes</div>
      </div>
      <div class="c11-no futuro" ${e('escala', 5)}></div>
      <div class="c11-linha futura" ${e('fade', 5)}>Próximos registros no sistema: contagem, movimentação e saída</div>
      <div class="c11-exemplo" ${e('fade', 6)}>${exemplo()}</div>
      <div class="selos c11-selos" ${e('fade', 7)}>${selo('DISPONIVEL', 'Histórico de movimentações')}${selo('AJUSTE', 'Cópia de segurança fora da máquina')}</div>`,
  });

  // 12 — Testar, medir e evoluir.
  const c12Ind = (x, i, titulo, pergunta) => `<div class="cartao c12-ind" ${e('sobe', i, `left:${x}px`)}><div class="rotulo">A medir no piloto</div><h3>${titulo}</h3><p>${pergunta}</p><div class="medida">Sem número ainda: será medido</div></div>`;
  cenas.push({
    id: '12', fundo: 'fundo-claro',
    html: () => `
      <div class="luz l-amarela-suave" style="left:600px;top:400px;width:1500px;height:1000px;--dx:-100px;--dy:-60px;animation-duration:16s"></div>
      <div class="luz l-branca" style="left:-300px;top:-300px;width:1100px;height:900px;--dx:80px;--dy:40px;animation-duration:13s"></div>
      <h2 class="titulo abs" ${e('sobe', 0, 'left:120px;top:150px')}>Transformar visibilidade em resultado.</h2>
      <div class="c12-passos" ${e('sobe', 1)}><span><span class="n">1</span>Validar a base</span><span class="tr"></span><span><span class="n">2</span>Testar no piso</span><span class="tr"></span><span><span class="n">3</span>Medir o efeito</span></div>
      ${c12Ind(120, 2, 'Tempo de localização', 'Quanto tempo leva para achar uma nota na praça?')}
      ${c12Ind(690, 3, 'Diferenças de estoque', 'Quanto a contagem difere do que está registrado?')}
      ${c12Ind(1260, 4, 'Claims investigados', 'Quantos casos de possível perda conseguimos investigar?')}
      <div class="c12-rodape" ${e('fade', 6)}>
        <div class="marca-final">${ICONE_APP}<span>Praça Reversa</span></div>
        <span class="dhl-placa"><span class="dhl-img" role="img" aria-label="DHL"></span></span>
        <div class="direita nota-tela">Versão de teste · piloto no piso a iniciar<br>Dados da apresentação: recorte de ${esc(D.snapshot.data)}</div>
      </div>`,
  });

  window.PR_CENAS = cenas;
})();

</script>
<script>
// Controlador único da apresentação: navegação manual, pontes entre cenas, controles, índice e notas.
// Sem avanço automático, sem consulta externa e sem gravação em lugar nenhum além da posição na URL (#n).
(() => {
  const R = window.PR_ROTEIRO;
  const CENAS = window.PR_CENAS;
  const $ = (s, r = document) => r.querySelector(s);
  const palco = $('#palco');
  const raiz = $('#cenas');
  const pontes = $('#pontes');
  const total = CENAS.length;
  const estatico = /[?&]estatico\b/.test(location.search);

  // ---------- Montagem: todas as cenas existem desde o início ----------
  const secoes = CENAS.map((c, i) => {
    const s = document.createElement('section');
    s.className = `cena ${c.fundo}`;
    s.dataset.cena = c.id;
    s.setAttribute('aria-label', `Cena ${c.id} — ${R[i].titulo}`);
    s.innerHTML = c.html();
    raiz.append(s);
    return s;
  });

  if (estatico) {
    document.body.classList.add('estatico');
    secoes.forEach((s) => s.classList.add('ativa'));
    document.fonts.ready.then(() => { $('#carregando')?.remove(); document.body.dataset.pronto = '1'; });
    return;
  }

  // ---------- Escala do palco (1920×1080 → janela) ----------
  let escala = 1;
  function ajustar() {
    const w = window.innerWidth, h = window.innerHeight;
    escala = Math.min(w / 1920, h / 1080);
    palco.style.transform = `translate(${(w - 1920 * escala) / 2}px, ${(h - 1080 * escala) / 2}px) scale(${escala})`;
  }
  window.addEventListener('resize', ajustar);
  ajustar();

  // ---------- Movimento reduzido ----------
  const prefereCalmo = window.matchMedia('(prefers-reduced-motion: reduce)');
  let calmo = prefereCalmo.matches;
  function aplicarCalmo() {
    document.body.classList.toggle('calmo', calmo);
    $('#b-movimento')?.setAttribute('aria-pressed', String(calmo));
    notificar();
  }

  // ---------- Navegação ----------
  let atual = -1;
  let tSaida = null;
  let tPonte = null;
  const ouvintes = new Set();
  const notificar = () => ouvintes.forEach((f) => f());

  function encerrarTransicoes() {
    clearTimeout(tSaida);
    clearTimeout(tPonte);
    pontes.getAnimations({ subtree: true }).forEach((a) => a.cancel());
    pontes.replaceChildren();
    secoes.forEach((s) => s.classList.remove('saindo', 'sai-aproxima'));
    document.querySelectorAll('.ponte-oculto').forEach((el) => el.classList.remove('ponte-oculto'));
  }

  /** Retângulo em coordenadas do palco (desfaz a escala). */
  function retangulo(el) {
    const r = el.getBoundingClientRect(), p = palco.getBoundingClientRect();
    return { x: (r.left - p.left) / escala, y: (r.top - p.top) / escala, w: r.width / escala, h: r.height / escala };
  }
  function paresDePonte(de, para) {
    const pares = [];
    de.querySelectorAll('[data-ponte]').forEach((a) => {
      const chaves = a.dataset.ponte.split(' ');
      const b = [...para.querySelectorAll('[data-ponte]')].find((x) => x.dataset.ponte.split(' ').some((k) => chaves.includes(k)));
      if (b) pares.push([a, b]);
    });
    return pares;
  }
  function clone(el, r) {
    const k = el.cloneNode(true);
    k.removeAttribute('data-e');
    k.removeAttribute('data-ponte');
    k.classList.remove('ponte-oculto', 'ponte-alvo');
    k.querySelectorAll('[data-e]').forEach((x) => x.removeAttribute('data-e'));
    Object.assign(k.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px`, animation: 'none', opacity: '1', transform: 'none' });
    pontes.append(k);
    return k;
  }

  function ir(n, modo = 'passo') {
    n = Math.max(0, Math.min(total - 1, n));
    if (n === atual) return;
    const de = atual >= 0 ? secoes[atual] : null;
    const para = secoes[n];
    encerrarTransicoes();
    secoes.forEach((s) => s.querySelectorAll('.ponte-alvo').forEach((x) => x.classList.remove('ponte-alvo')));

    const adjacente = de && Math.abs(n - atual) === 1 && modo === 'passo' && !calmo;
    const pares = adjacente ? paresDePonte(de, para) : [];
    const origens = pares.map(([a]) => retangulo(a));

    if (de) {
      de.classList.remove('ativa');
      de.classList.add('saindo');
      if (CENAS[atual].saida === 'aproxima' && n > atual && !calmo) de.classList.add('sai-aproxima');
      tSaida = setTimeout(() => de.classList.remove('saindo', 'sai-aproxima'), 620);
    }

    // Destinos das pontes medidos no estado de leitura, antes de a entrada começar.
    let destinos = [];
    if (pares.length) {
      para.classList.add('ativa', 'medindo');
      destinos = pares.map(([, b]) => retangulo(b));
      para.classList.remove('ativa', 'medindo');
    }
    void para.offsetWidth;
    para.classList.add('ativa');

    pares.forEach(([a, b], i) => {
      const ra = origens[i], rb = destinos[i];
      if (!ra.w || !rb.w) return;
      b.classList.add('ponte-alvo', 'ponte-oculto');
      a.classList.add('ponte-oculto');
      // A moldura muda de forma; o conteúdo só desliza e troca por transparência (letras nunca esticam).
      const ca = getComputedStyle(a), cb = getComputedStyle(b);
      const caixa = document.createElement('div');
      pontes.append(caixa);
      const ka = clone(a, ra), kb = clone(b, rb);
      [ka, kb].forEach((k) => Object.assign(k.style, { background: 'transparent', boxShadow: 'none', borderColor: 'transparent' }));
      const forma = (r, c) => ({ left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px`, backgroundColor: c.backgroundColor, borderRadius: c.borderRadius, boxShadow: c.boxShadow === 'none' ? '0 0 0 0 transparent' : c.boxShadow });
      const op = { duration: 760, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'both' };
      const d = `translate(${rb.x - ra.x}px, ${rb.y - ra.y}px)`, v = `translate(${ra.x - rb.x}px, ${ra.y - rb.y}px)`;
      caixa.animate([forma(ra, ca), forma(rb, cb)], op);
      ka.animate([{ transform: 'none', opacity: 1 }, { transform: d, opacity: 0, offset: 0.45 }, { transform: d, opacity: 0 }], op);
      kb.animate([{ transform: v, opacity: 0 }, { transform: v, opacity: 0, offset: 0.5 }, { transform: 'none', opacity: 1 }], op);
    });
    if (pares.length) {
      tPonte = setTimeout(() => {
        pontes.replaceChildren();
        pares.forEach(([a, b]) => { a.classList.remove('ponte-oculto'); b.classList.remove('ponte-oculto'); });
      }, 780);
    }

    atual = n;
    history.replaceState(null, '', `#${n + 1}`);
    notificar();
  }
  const proxima = () => ir(atual + 1);
  const anterior = () => ir(atual - 1);

  // ---------- Controles visíveis ----------
  const controles = $('#controles');
  const contador = $('#contador');
  const progresso = $('#progresso');
  ouvintes.add(() => {
    contador.textContent = `${String(atual + 1).padStart(2, '0')} / ${total}`;
    progresso.style.width = `${((atual + 1) / total) * 100}%`;
  });
  let tOcultar = null;
  let controlesFixosOcultos = false;
  function mostrarControles() {
    if (controlesFixosOcultos) return;
    document.body.classList.remove('controles-ocultos', 'ocultar-cursor');
    clearTimeout(tOcultar);
    tOcultar = setTimeout(() => {
      if (controles.matches(':hover') || !$('#indice').hidden) return;
      document.body.classList.add('controles-ocultos', 'ocultar-cursor');
    }, 2600);
  }
  window.addEventListener('mousemove', mostrarControles);
  function alternarControles() {
    controlesFixosOcultos = !controlesFixosOcultos;
    if (controlesFixosOcultos) document.body.classList.add('controles-ocultos', 'ocultar-cursor');
    else mostrarControles();
  }

  let tAviso = null;
  function aviso(texto) {
    const a = $('#aviso');
    a.textContent = texto;
    a.classList.add('visivel');
    clearTimeout(tAviso);
    tAviso = setTimeout(() => a.classList.remove('visivel'), 5200);
  }

  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => aviso('O navegador não permitiu a tela cheia. Use F11.'));
  }
  document.addEventListener('fullscreenchange', () => $('#b-tela')?.setAttribute('aria-pressed', String(!!document.fullscreenElement)));

  function alternarCortina() { document.body.classList.toggle('cortina'); }

  // ---------- Índice ----------
  const indice = $('#indice');
  const lista = $('#indice ol');
  lista.innerHTML = R.map((r, i) => `<li><button type="button" data-ir="${i}"><b>${r.id}</b><span>${r.titulo}</span></button></li>`).join('');
  function abrirIndice() {
    indice.hidden = false;
    lista.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-current', String(i === atual)));
    lista.querySelectorAll('button')[Math.max(0, atual)]?.focus();
    mostrarControles();
  }
  function fecharIndice() { indice.hidden = true; document.activeElement?.blur?.(); }
  lista.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-ir]');
    if (!b) return;
    fecharIndice();
    ir(Number(b.dataset.ir), 'salto');
  });
  indice.addEventListener('click', (ev) => { if (ev.target === indice) fecharIndice(); });

  // ---------- Teclado (passador comum: PageDown/PageUp; também setas e espaço) ----------
  const AVANCA = new Set(['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Spacebar', 'Enter']);
  const VOLTA = new Set(['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace']);
  function teclado(ev, origem = 'apresentacao') {
    if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const k = ev.key;
    if (!indice.hidden) {
      if (k === 'Escape' || k === 'i' || k === 'I') { ev.preventDefault(); fecharIndice(); }
      if (k === 'Enter' || k === ' ') return; // o botão em foco no índice decide
      if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Tab'].includes(k)) return;
      return;
    }
    if (AVANCA.has(k)) { ev.preventDefault(); if (!ev.repeat) proxima(); }
    else if (VOLTA.has(k)) { ev.preventDefault(); if (!ev.repeat) anterior(); }
    else if (k === 'Home') { ev.preventDefault(); ir(0, 'salto'); }
    else if (k === 'End') { ev.preventDefault(); ir(total - 1, 'salto'); }
    else if (k === 'i' || k === 'I' || k === 'g' || k === 'G') { ev.preventDefault(); abrirIndice(); }
    else if ((k === 'f' || k === 'F') && origem === 'apresentacao') { ev.preventDefault(); telaCheia(); }
    else if (k === 'm' || k === 'M') { ev.preventDefault(); calmo = !calmo; aplicarCalmo(); aviso(calmo ? 'Movimentos reduzidos.' : 'Movimentos normais.'); }
    else if (k === 'n' || k === 'N') { ev.preventDefault(); abrirNotas(); }
    else if (k === 'h' || k === 'H') { ev.preventDefault(); alternarControles(); }
    else if (k === 'b' || k === 'B' || k === '.') { ev.preventDefault(); alternarCortina(); }
    else if (/^[0-9]$/.test(k)) { /* sem atalho numérico: evita salto acidental */ }
  }
  window.addEventListener('keydown', (ev) => teclado(ev));

  // Botões: o clique age uma vez e devolve o foco ao documento (espaço/Enter não repetem a ação).
  controles.addEventListener('mousedown', (ev) => ev.preventDefault());
  controles.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    const acao = b.dataset.acao;
    if (acao === 'anterior') anterior();
    else if (acao === 'proxima') proxima();
    else if (acao === 'indice') abrirIndice();
    else if (acao === 'notas') abrirNotas();
    else if (acao === 'movimento') { calmo = !calmo; aplicarCalmo(); }
    else if (acao === 'tela') telaCheia();
    else if (acao === 'ocultar') alternarControles();
    b.blur();
  });

  // ---------- Notas do apresentador (janela própria; nunca na tela projetada) ----------
  let jNotas = null;
  let inicioFala = null;
  let tRelogio = null;
  const CSS_NOTAS = `
    *{box-sizing:border-box} body{margin:0;background:#17191C;color:#F5F3EB;font-family:Inter,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
    header{display:flex;align-items:center;gap:18px;padding:16px 24px;background:#0F1012;border-bottom:1px solid #2A2E34;position:sticky;top:0}
    header .cena{font-size:15px;font-weight:700;color:#FFCC00;letter-spacing:.06em}
    header h1{margin:0;font-size:22px;font-weight:800;flex:1}
    header .tempo{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
    header .hora{font-variant-numeric:tabular-nums;font-size:15px;color:#9A978E}
    main{display:grid;grid-template-columns:1fr 330px;gap:0;min-height:calc(100vh - 64px)}
    .fala{padding:26px 34px 60px;font-size:27px;line-height:1.5}
    .fala p{margin:0 0 18px}
    aside{background:#1F2226;padding:22px;border-left:1px solid #2A2E34;display:flex;flex-direction:column;gap:18px}
    aside h2{margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9A978E}
    .prox{font-size:19px;font-weight:700;line-height:1.35}
    .cuidados{margin:0;padding-left:18px;font-size:16px;line-height:1.45;color:#D8D4C8}
    .cuidados li{margin-bottom:8px}
    .botoes{display:flex;gap:10px}
    button{font:700 16px Inter,'Segoe UI',Arial,sans-serif;padding:12px 16px;border-radius:10px;border:0;background:#2E3238;color:#F5F3EB;cursor:pointer;flex:1}
    button.prim{background:#FFCC00;color:#17191C}
    .lista{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .lista button{padding:8px 0;font-size:14px;flex:none}
    .lista button[aria-current=true]{background:#FFCC00;color:#17191C}
    .dica{font-size:13px;color:#9A978E;line-height:1.5}`;
  function montarNotas(d) {
    d.open();
    d.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Notas — Praça Reversa</title><style>${CSS_NOTAS}</style></head><body>
      <header><span class="cena" id="n-num"></span><h1 id="n-tit"></h1><span class="tempo" id="n-tempo" title="Tempo desde que as notas foram abertas">00:00</span><span class="hora" id="n-hora"></span></header>
      <main><section class="fala" id="n-fala"></section>
      <aside>
        <div class="botoes"><button id="n-ant">‹ Anterior</button><button class="prim" id="n-prox">Próxima ›</button></div>
        <div><h2>Próxima cena</h2><div class="prox" id="n-prox-tit"></div></div>
        <div><h2>Lembretes</h2><ul class="cuidados" id="n-cuid"></ul></div>
        <div><h2>Ir para</h2><div class="lista" id="n-lista"></div></div>
        <div class="dica">Esta janela fica no seu monitor; a apresentação vai para o projetor (tela estendida). Setas, espaço e PageUp/PageDown funcionam aqui também. Em tela espelhada, use o roteiro impresso ou no celular.</div>
        <button id="n-zerar">Zerar tempo</button>
      </aside></main></body></html>`);
    d.close();
  }
  function atualizarNotas() {
    if (!jNotas || jNotas.closed) return;
    const d = jNotas.document;
    const r = R[atual];
    const prox = R[atual + 1];
    d.getElementById('n-num').textContent = `CENA ${r.id} / ${String(total).padStart(2, '0')}`;
    d.getElementById('n-tit').textContent = r.titulo;
    d.getElementById('n-fala').innerHTML = r.fala.map((p) => `<p>${p}</p>`).join('');
    d.getElementById('n-prox-tit').textContent = prox ? `${prox.id} · ${prox.titulo}` : 'Fim — permanecer nesta cena';
    d.getElementById('n-cuid').innerHTML = (r.cuidados || []).map((c) => `<li>${c}</li>`).join('') || '<li>—</li>';
    d.getElementById('n-lista').innerHTML = R.map((x, i) => `<button data-ir="${i}" aria-current="${i === atual}">${x.id}</button>`).join('');
    d.title = `Notas ${r.id} — Praça Reversa`;
  }
  function relogio() {
    if (!jNotas || jNotas.closed) { clearInterval(tRelogio); tRelogio = null; return; }
    const s = Math.floor((Date.now() - inicioFala) / 1000);
    const d = jNotas.document;
    d.getElementById('n-tempo').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    d.getElementById('n-hora').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function abrirNotas() {
    if (jNotas && !jNotas.closed) { jNotas.focus(); return; }
    jNotas = window.open('', 'praca-reversa-notas', 'popup=yes,width=1200,height=820');
    if (!jNotas) { aviso('O navegador bloqueou a janela de notas. Permita janelas pop-up para este arquivo ou use o "Roteiro do apresentador".'); return; }
    try {
      montarNotas(jNotas.document);
    } catch {
      aviso('Não foi possível preparar a janela de notas neste navegador. Use o "Roteiro do apresentador".');
      return;
    }
    const d = jNotas.document;
    d.getElementById('n-ant').onclick = () => anterior();
    d.getElementById('n-prox').onclick = () => proxima();
    d.getElementById('n-zerar').onclick = () => { inicioFala = Date.now(); relogio(); };
    d.getElementById('n-lista').addEventListener('click', (ev) => { const b = ev.target.closest('[data-ir]'); if (b) ir(Number(b.dataset.ir), 'salto'); });
    d.addEventListener('mousedown', (ev) => { if (ev.target.closest('button')) ev.preventDefault(); });
    jNotas.addEventListener('keydown', (ev) => teclado(ev, 'notas'));
    inicioFala = Date.now();
    clearInterval(tRelogio);
    tRelogio = setInterval(relogio, 1000);
    relogio();
    atualizarNotas();
  }
  ouvintes.add(atualizarNotas);
  window.addEventListener('beforeunload', () => { clearInterval(tRelogio); });

  // ---------- Início ----------
  aplicarCalmo();
  prefereCalmo.addEventListener?.('change', (ev) => { calmo = ev.matches; aplicarCalmo(); });
  const inicial = Math.max(0, Math.min(total - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  document.fonts.ready.then(() => {
    $('#carregando')?.remove();
    ir(inicial, 'salto');
    mostrarControles();
    document.body.dataset.pronto = '1';
  });
  window.addEventListener('hashchange', () => {
    const n = (parseInt(location.hash.slice(1), 10) || 1) - 1;
    if (n !== atual) ir(n, 'salto');
  });

  // Somente para conferência automatizada (sem efeito na apresentação).
  window.PR_APRESENTACAO = { ir, proxima, anterior, atual: () => atual, total, calmo: () => calmo };
})();

</script>
</body>
</html>
