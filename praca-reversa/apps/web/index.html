<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Praça Reversa: mapa de paletes e devoluções. Demonstração com dados fictícios." />
    <meta name="theme-color" content="#FFCC00" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Praça Reversa · Demonstração</title>
    <script>
      // Tema antes da primeira pintura (sem piscar): escolha salva neste navegador ou o tema do sistema. Ver src/tema.ts.
      (function () {
        var tema = null;
        try {
          tema = window.localStorage.getItem('praca-reversa:tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-tema', tema);
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>O Praça Reversa precisa de JavaScript habilitado no navegador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
